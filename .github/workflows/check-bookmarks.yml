name: 书签链接检测

on:
  workflow_dispatch:
  
  schedule:
    - cron: "0 2 * * 0"

jobs:
  check:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 检测书签链接
        uses: lycheeverse/lychee-action@v2
        with:
          fail: false
          args: >
            bookmarks.html
            --verbose
            --threads 10
            --timeout 30
            --max-redirects 5
            --accept 200,201,202,301,302,307,308
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传检测报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 链接检测报告
          path: |
            lychee-report.md
            report.md
            *.md
          if-no-files-found: ignore
