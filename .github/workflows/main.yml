name: Check Bookmarks

on:
  workflow_dispatch:

  schedule:
    - cron: "0 2 * * 0"

jobs:
  check:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check bookmarks
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            bookmarks.html
            --verbose
            --insecure
            --threads 50
            --timeout 20
            --max-redirects 5
            --format markdown
            --output lychee-report.md

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: lychee-report
          path: lychee-report.md
